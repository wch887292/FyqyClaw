<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命令面板 - 模糊搜索测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    background: #1e1e1e; color: #cccccc; font-size: 13px; height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  /* 页面头部 */
  .header {
    width: 100%; padding: 16px 24px; background: #252526;
    border-bottom: 1px solid #3c3c3c; text-align: center;
  }
  .header h1 { font-size: 18px; font-weight: 400; color: #fff; margin-bottom: 4px; }
  .header p { font-size: 12px; color: #969696; }
  .header kbd {
    display: inline-block; padding: 2px 6px; background: #3c3c3c;
    border: 1px solid #555; border-radius: 3px; font-size: 11px;
    font-family: monospace; color: #dcdcaa; margin: 0 2px;
  }
  /* 测试控制区 */
  .controls {
    width: 100%; max-width: 600px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .controls label { font-size: 12px; color: #969696; font-weight: 600; }
  .controls textarea {
    width: 100%; height: 280px; background: #252526; border: 1px solid #3c3c3c;
    border-radius: 6px; color: #cccccc; font-size: 12px; font-family: monospace;
    padding: 12px; resize: vertical; outline: none; line-height: 1.6;
  }
  .controls textarea:focus { border-color: #0078d4; }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: background 0.15s;
  }
  .btn-primary { background: #0078d4; color: #fff; }
  .btn-primary:hover { background: #1a8ae8; }
  .btn-secondary { background: #3c3c3c; color: #ccc; }
  .btn-secondary:hover { background: #4a4a4a; }
  /* 命令面板预览区 */
  .preview-area {
    width: 100%; max-width: 600px; padding: 0 20px; flex: 1; position: relative;
  }
  .preview-frame {
    background: #252526; border: 1px solid #3c3c3c; border-radius: 8px;
    overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  /* 搜索输入框 */
  .search-box {
    display: flex; align-items: center; padding: 8px 12px;
    border-bottom: 1px solid #3c3c3c;
  }
  .search-box .icon { color: #969696; font-size: 14px; margin-right: 8px; }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: #cccccc; font-size: 14px; line-height: 24px;
  }
  .search-box input::placeholder { color: #5a5a5a; }
  .search-box .clear-btn {
    background: none; border: none; color: #969696; cursor: pointer;
    font-size: 16px; padding: 0 4px; display: none;
  }
  .search-box .clear-btn.show { display: block; }
  /* 命令列表 */
  .cmd-list { max-height: 360px; overflow-y: auto; padding: 4px 0; }
  .cmd-category {
    padding: 4px 12px; font-size: 11px; font-weight: 600;
    color: #969696; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .cmd-item {
    display: flex; align-items: center; padding: 6px 12px; cursor: pointer;
    transition: background 0.08s; margin: 2px 4px; border-radius: 4px;
  }
  .cmd-item:hover, .cmd-item.selected { background: #0078d4; color: #fff; }
  .cmd-item .cmd-icon { margin-right: 8px; font-size: 14px; opacity: 0.8; }
  .cmd-item .cmd-info { flex: 1; min-width: 0; }
  .cmd-item .cmd-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd-item .cmd-desc { font-size: 11px; opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd-item .cmd-shortcut {
    font-size: 11px; opacity: 0.5; margin-left: 12px; white-space: nowrap; font-family: monospace;
  }
  .cmd-item.selected .cmd-shortcut { opacity: 0.8; }
  .cmd-empty { padding: 24px; text-align: center; color: #969696; font-size: 13px; }
  /* 匹配高亮 */
  .highlight { color: #dcdcaa; font-weight: 600; }
  .cmd-item.selected .highlight { color: #fff; }
  /* 滚动条 */
  .cmd-list::-webkit-scrollbar { width: 6px; }
  .cmd-list::-webkit-scrollbar-track { background: transparent; }
  .cmd-list::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
  .cmd-list::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }
  /* 统计信息 */
  .stats { font-size: 11px; color: #5a5a5a; padding: 6px 12px; border-top: 1px solid #3c3c3c; }
</style>
</head>
<body>

<div class="header">

<div class="controls">

  <textarea id="mockData" spellcheck="false">[

  { "id": "open-folder", "label": "打开文件夹", "description": "选择并打开项目文件夹", "category": "文件", "icon": "📁" },
  { "id": "open-file", "label": "打开文件", "description": "打开文件到编辑器", "category": "文件", "icon": "📄" },

  { "id": "git-commit", "label": "提交变更", "description": "暂存所有变更并提交", "category": "Git", "shortcut": "Ctrl+Enter", "icon": "⎇" },
  { "id": "git-branch", "label": "切换分支", "description": "查看和切换 Git 分支", "category": "Git", "icon": "⎇" },
  { "id": "git-push", "label": "推送代码", "description": "推送到远程仓库", "category": "Git", "icon": "⎇" },
  { "id": "git-pull", "label": "拉取代码", "description": "从远程仓库拉取最新代码", "category": "Git", "icon": "⎇" },

  { "id": "go-to-line", "label": "跳转到行", "description": "跳转到指定行号", "category": "导航", "shortcut": "Ctrl+G", "icon": "↗" },

  { "id": "toggle-output", "label": "切换输出面板", "description": "显示或隐藏输出面板", "category": "视图", "icon": "⬚" },
  { "id": "toggle-minimap", "label": "切换缩略图", "description": "显示或隐藏编辑器缩略图", "category": "视图", "icon": "⬚" },
  { "id": "format-code", "label": "格式化代码", "description": "格式化当前文件的代码", "category": "编辑", "shortcut": "Shift+Alt+F", "icon": "✂" },

  { "id": "close-all-tabs", "label": "关闭所有标签", "description": "关闭所有打开的编辑器标签", "category": "文件", "icon": "✕" },

  { "id": "run-dev", "label": "启动开发服务器", "description": "运行开发服务器", "category": "开发", "icon": "▶" },
  { "id": "run-test", "label": "运行测试", "description": "运行项目测试套件", "category": "开发", "icon": "🧪" },
  { "id": "debug-start", "label": "启动调试", "description": "以调试模式启动应用", "category": "开发", "icon": "🐛" },
  { "id": "ext-manager", "label": "扩展管理器", "description": "管理和安装扩展", "category": "扩展", "icon": "◆" },
  { "id": "ext-search", "label": "搜索扩展", "description": "在扩展市场中搜索", "category": "扩展", "icon": "◆" },
  { "id": "settings-open", "label": "打开设置", "description": "打开应用设置面板", "category": "系统", "shortcut": "Ctrl+,", "icon": "⚙" },
  { "id": "keyboard-shortcuts", "label": "键盘快捷键", "description": "查看所有键盘快捷键绑定", "category": "系统", "icon": "⌨" },
  { "id": "about", "label": "关于 FyqyClaw", "description": "查看应用版本和版权信息", "category": "系统", "icon": "ℹ" },
  { "id": "check-update", "label": "检查更新", "description": "检查是否有新版本可用", "category": "系统", "icon": "⬆" },
  { "id": "theme-switch", "label": "切换主题", "description": "在浅色和深色主题之间切换", "category": "视图", "icon": "🎨" },
  { "id": "zoom-in", "label": "放大", "description": "放大编辑器字体", "category": "视图", "shortcut": "Ctrl+=", "icon": "🔍" },
  { "id": "zoom-out", "label": "缩小", "description": "缩小编辑器字体", "category": "视图", "shortcut": "Ctrl+-", "icon": "🔍" },
  { "id": "toggle-word-wrap", "label": "切换自动换行", "description": "开启或关闭编辑器自动换行", "category": "视图", "icon": "↩" }
]</textarea>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="applyMockData()">🔄 应用 Mock 数据</button>
    <button class="btn btn-secondary" onclick="document.getElementById('mockData').value=defaultData; applyMockData()">↩ 恢复默认</button>
    <button class="btn btn-secondary" onclick="openPalette()">⌘ 打开命令面板</button>
  </div>
</div>

<div class="preview-area" id="paletteContainer">
  <!-- 命令面板由 JS 渲染到这里 -->
</div>

<script>
// ========== 默认数据 ==========
const defaultData = document.getElementById('mockData').value

// ========== 状态 ==========
let commands = []
let filteredCommands = []
let query = ''
let selectedIndex = 0

// ========== 模糊搜索函数 ==========
function fuzzyMatch(text, pattern) {
  if (!pattern) return { match: true, score: 0, highlights: [] }
  const lowerText = text.toLowerCase()
  const lowerPattern = pattern.toLowerCase()

  // 精确匹配
  if (lowerText === lowerPattern) return { match: true, score: 100, highlights: [[0, text.length]] }

  // 前缀匹配
  if (lowerText.startsWith(lowerPattern)) return { match: true, score: 90, highlights: [[0, pattern.length]] }

  // 包含匹配
  const idx = lowerText.indexOf(lowerPattern)
  if (idx >= 0) return { match: true, score: 70, highlights: [[idx, idx + pattern.length]] }

  // 单词首字母匹配 (驼峰/缩写)
  const words = text.split(/[\s_-]/)
  let wordIdx = 0
  let charIdx = 0
  let wordMatch = ''
  let positions = []
  for (const word of words) {
    if (word.length > 0 && word[0].toLowerCase() === lowerPattern[charIdx]) {
      wordMatch += word[0]
      positions.push({ word, char: 0 })
      charIdx++
      if (charIdx >= lowerPattern.length) break
    }
  }
  if (wordMatch.length === lowerPattern.length) {
    return { match: true, score: 80, highlights: positions.map(p => {
      const globalIdx = text.indexOf(p.word)
      return [globalIdx, globalIdx + 1]
    })}
  }

  // 子序列匹配 (字符按顺序出现但不连续)
  let pi = 0, lastPos = -1
  let subSeqScore = 0
  for (const ch of lowerPattern) {
    const found = lowerText.indexOf(ch, lastPos + 1)
    if (found < 0) return { match: false, score: 0, highlights: [] }
    subSeqScore += (found - lastPos - 1) === 0 ? 3 : 1
    lastPos = found
  }
  // 越紧凑得分越高
  const compactScore = Math.max(0, 30 - (lastPos - lowerPattern.length + 1) * 2)
  return { match: true, score: Math.min(65, 30 + compactScore + subSeqScore), highlights: [] }
}

// ========== 高亮渲染 ==========
function highlightText(text, highlights) {
  if (!highlights || highlights.length === 0) return text
  let result = ''
  let lastEnd = 0
  const sorted = [...highlights].sort((a, b) => a[0] - b[0])
  for (const [start, end] of sorted) {
    if (start > lastEnd) result += text.slice(lastEnd, start)
    result += `<span class="highlight">${text.slice(start, end)}</span>`
    lastEnd = end
  }
  if (lastEnd < text.length) result += text.slice(lastEnd)
  return result
}

// ========== 搜索过滤 ==========
function filterCommands() {
  if (!query.trim()) {
    filteredCommands = commands
    selectedIndex = 0
    render()
    return
  }

  const scored = commands.map(cmd => {
    const labelMatch = fuzzyMatch(cmd.label, query)
    const descMatch = cmd.description ? fuzzyMatch(cmd.description, query) : { match: false, score: 0, highlights: [] }
    const catMatch = cmd.category ? fuzzyMatch(cmd.category, query) : { match: false, score: 0, highlights: [] }

    // 综合评分：label 权重最高，description 次之，category 最低
    const totalScore = labelMatch.score * 1.0 + descMatch.score * 0.3 + catMatch.score * 0.2

    return {
      ...cmd,
      _score: totalScore,
      _labelHL: labelMatch.highlights,
      _descHL: descMatch.highlights,
      _match: labelMatch.match || descMatch.match || catMatch.match,
    }
  })

  filteredCommands = scored
    .filter(c => c._match)
    .sort((a, b) => b._score - a._score)

  if (selectedIndex >= filteredCommands.length) selectedIndex = Math.max(0, filteredCommands.length - 1)
  render()
}

// ========== 渲染 ==========
function render() {
  const container = document.getElementById('paletteContainer')
  if (!container._visible) {
    container.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:#5a5a5a;">
        <div style="font-size:40px;margin-bottom:12px;opacity:0.4;">⌘</div>
        <div style="font-size:14px;margin-bottom:4px;">命令面板已关闭</div>
        <div style="font-size:12px;">点击「打开命令面板」按钮或按 <kbd style="background:#3c3c3c;padding:1px 5px;border:1px solid #555;border-radius:2px;font-size:11px;color:#dcdcaa;">Ctrl+Shift+P</kbd> 测试</div>
      </div>
    `
    return
  }

  // 按分类分组
  const grouped = {}
  for (const cmd of filteredCommands) {
    if (!grouped[cmd.category]) grouped[cmd.category] = []
    grouped[cmd.category].push(cmd)
  }

  let html = `<div class="preview-frame">`
  // 搜索框
  html += `<div class="search-box">
    <span class="icon">⌘</span>
    <input type="text" id="searchInput" value="${escapeHtml(query)}" placeholder="输入命令名称..." oninput="onQueryChange(this.value)" onkeydown="onKeyDown(event)" autofocus>
    <button class="clear-btn${query ? ' show' : ''}" onclick="clearQuery()">×</button>
  </div>`
  // 命令列表
  html += `<div class="cmd-list">`
  let globalIdx = 0
  for (const [category, cmds] of Object.entries(grouped)) {
    html += `<div class="cmd-category">${escapeHtml(category)}</div>`
    for (const cmd of cmds) {
      const sel = globalIdx === selectedIndex ? ' selected' : ''
      html += `<div class="cmd-item${sel}" onclick="executeCommand(${globalIdx})" onmouseenter="setSelected(${globalIdx})">
        ${cmd.icon ? `<span class="cmd-icon">${cmd.icon}</span>` : ''}
        <div class="cmd-info">
          <div class="cmd-label">${highlightText(escapeHtml(cmd.label), cmd._labelHL)}</div>
          <div class="cmd-desc">${highlightText(escapeHtml(cmd.description || ''), cmd._descHL)}</div>
        </div>
        ${cmd.shortcut ? `<span class="cmd-shortcut">${cmd.shortcut}</span>` : ''}
      </div>`
      globalIdx++
    }
  }
  if (filteredCommands.length === 0) {
    html += `<div class="cmd-empty">未找到匹配的命令</div>`
  }
  html += `</div>`
  // 统计
  html += `<div class="stats">共 ${filteredCommands.length} / ${commands.length} 个命令</div>`
  html += `</div>`

  container.innerHTML = html

  // 聚焦输入框
  const input = document.getElementById('searchInput')
  if (input) input.focus()
}

function escapeHtml(text) {
  const div = document.createElement('div')
  div.textContent = text
  return div.innerHTML
}

// ========== 交互事件 ==========
function onQueryChange(val) {
  query = val
  selectedIndex = 0
  filterCommands()
}

function clearQuery() {
  query = ''
  selectedIndex = 0
  filterCommands()
}

function setSelected(idx) {
  selectedIndex = idx
  render()
}

function executeCommand(idx) {
  const cmd = filteredCommands[idx]
  if (!cmd) return
  const action = cmd.label
  const oldSelected = selectedIndex
  selectedIndex = idx
  render()
  // 显示执行反馈（mock）
  const container = document.getElementById('paletteContainer')
  container._visible = false
  container.innerHTML = `
    <div style="text-align:center;padding:60px 20px;color:#5a5a5a;">
      <div style="font-size:32px;margin-bottom:12px;opacity:0.6;">${cmd.icon || '✔'}</div>
      <div style="font-size:16px;color:#4ec9b0;margin-bottom:8px;">已执行命令</div>
      <div style="font-size:14px;color:#ccc;margin-bottom:4px;">${escapeHtml(cmd.label)}</div>
      <div style="font-size:12px;color:#969696;">${escapeHtml(cmd.description || '')}</div>
      <div style="margin-top:20px;">
        <button class="btn btn-primary" onclick="openPalette()">重新打开命令面板</button>
      </div>
    </div>
  `
}

function onKeyDown(e) {
  switch (e.key) {
    case 'ArrowDown':
      e.preventDefault()
      selectedIndex = Math.min(selectedIndex + 1, filteredCommands.length - 1)
      render()
      break
    case 'ArrowUp':
      e.preventDefault()
      selectedIndex = Math.max(selectedIndex - 1, 0)
      render()
      break
    case 'Enter':
      e.preventDefault()
      executeCommand(selectedIndex)
      break
    case 'Escape':
      e.preventDefault()
      closePalette()
      break
  }
}

// ========== 全局快捷键 ==========
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.code === 'KeyP') {
    e.preventDefault()
    const container = document.getElementById('paletteContainer')
    container._visible ? closePalette() : openPalette()
  }
  if (e.code === 'Escape') {
    const container = document.getElementById('paletteContainer')
    if (container._visible) closePalette()
  }
})

// ========== 打开/关闭 ==========
function openPalette() {
  const container = document.getElementById('paletteContainer')
  container._visible = true
  selectedIndex = 0
  filterCommands()
}

function closePalette() {
  const container = document.getElementById('paletteContainer')
  container._visible = false
  render()
}

// ========== 应用 Mock 数据 ==========
function applyMockData() {
  try {
    const raw = document.getElementById('mockData').value
    const parsed = JSON.parse(raw)
    if (!Array.isArray(parsed)) throw new Error('数据必须是数组')
    commands = parsed
    filterCommands()
    openPalette()
  } catch (err) {
    alert('JSON 解析失败: ' + err.message)
  }
}

// ========== 初始化 ==========
applyMockData()
</script>
</body>
</html>
