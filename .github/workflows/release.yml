name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # 第 4 步的权限，写在这里也生效

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 挂 job 级，所有 step 都能拿到

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build & Publish
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 再挂一层，双保险
