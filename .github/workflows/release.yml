name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # ⚠️ 必须写在job下面，不是写在step里面！
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Auto Publish
        env:
          # 注入内置token，不需要你自己创建PAT
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win
