name: Build & Release

on:
  push:
    tags:
      - 'v*'

# 允许 workflow 创建/写入 GitHub Release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build Windows installer
        run: npm run build:win
      - uses: actions/upload-artifact@v5
        with:
          name: windows-artifacts
          path: release/*

  build-macos:
    if: false  # 临时跳过：尚未配置签名 Secrets，避免浪费 macos 额度；配好 Secrets 后删除此行
    runs-on: macos-latest
    env:
      # macOS 代码签名 + 公证：以下 Secrets 在仓库 Settings 配置；未配置则自动跳过、按未签名构建
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build macOS artifacts
        run: npm run build:mac
      - uses: actions/upload-artifact@v5
        with:
          name: macos-artifacts
          path: release/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build Linux artifacts
        run: npm run build:linux
      - uses: actions/upload-artifact@v5
        with:
          name: linux-artifacts
          path: release/*

  # 等三个平台都构建完，统一创建一次 Release 并上传所有产物
  release:
    needs: [build-windows, build-macos, build-linux]
    # macOS 未配置签名时会被 if:false 跳过(skipped)，默认 success() 条件会让本 job 也跳过；
    # 改为「无失败且未取消」即运行，skipped 的 macos 不影响 Release 生成
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release & upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
