name: Build & Release

on:
  push:
    tags:
      - 'v*'

# 允许 workflow 创建/写入 GitHub Release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build Windows installer
        run: npm run build:win
      - uses: actions/upload-artifact@v5
        with:
          name: windows-artifacts
          # 只上传真正的安装包，排除 win-unpacked 展开目录里的零散文件
          path: release/*.exe

  build-macos:
    if: false  # 临时跳过：尚未配置签名 Secrets，避免浪费 macos 额度；配好 Secrets 后删除此行
    runs-on: macos-latest
    env:
      # macOS 代码签名 + 公证：以下 Secrets 在仓库 Settings 配置；未配置则自动跳过、按未签名构建
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build macOS artifacts
        run: npm run build:mac
      - uses: actions/upload-artifact@v5
        with:
          name: macos-artifacts
          path: release/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build Linux artifacts
        run: npm run build:linux
      - uses: actions/upload-artifact@v5
        with:
          name: linux-artifacts
          # 只上传真正的安装包，排除 linux-unpacked 展开目录里的零散文件
          path: |
            release/*.AppImage
            release/*.deb

  # 等平台构建完，统一删除旧 Release 并重建一次干净的 Release（只含安装包）
  release:
    needs: [build-windows, build-linux]
    # macOS 未配置签名时会被 if:false 跳过(skipped)；改为「无失败且未取消」即运行
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete any existing release for this tag (clean rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}"
          rel_id=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/${{ github.ref_name }}" | jq -r '.id // empty')
          if [ -n "$rel_id" ]; then
            echo "Deleting stale release id $rel_id"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$rel_id"
            echo "Deleted stale release."
          else
            echo "No existing release for ${{ github.ref_name }} — will create fresh."
          fi

      - name: Create GitHub Release & upload installers only
        uses: softprops/action-gh-release@v2
        with:
          # 只上传真正的安装包，绝不带上 win-unpacked / linux-unpacked 的零散文件
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
