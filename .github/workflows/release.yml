name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 关键：允许action创建release、上传资产

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 内置token，无需手动创建PAT
        run: npm run build:win
