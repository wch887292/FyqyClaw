<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="FyqyClaw Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="16" y="16" width="208" height="208" rx="48" fill="url(#bg)"/>

  <!-- 六边形网格底纹 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2">
    <path d="M120 40 l34 20 v40 l-34 20 l-34 -20 v-40 z"/>
    <path d="M120 110 l34 20 v40 l-34 20 l-34 -20 v-40 z"/>
    <path d="M86 75 l34 20 v40 l-34 20 l-34 -20 v-40 z"/>
    <path d="M154 75 l34 20 v40 l-34 20 l-34 -20 v-40 z"/>
  </g>

  <!-- 爪形 FC 字母 -->
  <text x="120" y="152" font-family="Arial, Helvetica, 'PingFang SC', sans-serif"
        font-size="96" font-weight="800" fill="url(#claw)" text-anchor="middle"
        letter-spacing="-4">FC</text>

  <!-- 爪尖点缀 -->
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="120" cy="58" r="5"/>
    <circle cx="150" cy="70" r="4"/>
    <circle cx="90" cy="70" r="4"/>
  </g>
</svg>
